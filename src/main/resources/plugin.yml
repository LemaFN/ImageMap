name: ImageCanvas
version: '${version}'
main: dev.imagecanvas.ImageCanvasPlugin
api-version: '26.1'
description: Bilder als Map-Art, die Server-Neustarts ueberleben
commands:
  imagemap:
    description: Bilder als Karten erstellen und verwalten
    usage: /imagemap <upload|create|give|delete|list|reload>
    aliases: [imagecanvas, ic]
    permission: imagecanvas.use
permissions:
  imagecanvas.use:
    description: Darf /imagemap benutzen
    default: op
